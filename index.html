<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="/js/storage-form-script.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

  <div class="container mt-5">
    <div class="row">
      <div class="col-8" data-example>
        <form data-form>
          <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label">Email address</label>
            <input name="email" type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
          </div>

          <div class="mb-3">
            <label for="ageField" class="form-label">Age</label>
            <input name="age" type="number" class="form-control" id="ageField" placeholder="Age">
          </div>

          <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label">Example textarea</label>
            <textarea name="message" class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
          </div>

          <div class="mt-3 d-flex gap-3">
            <button class="mt-3 btn btn-success" type="submit" >Submit</button>
            <button class="mt-3 btn btn-danger" type="reset" >Reset</button>
          </div>
        </form>
      </div>
      <div class="col-4" data-form-values>
<!--          <ul class="list-group">-->
<!--              <li class="list-group-item">EMAIL: An item</li>-->
<!--              <li class="list-group-item">A second item</li>-->
<!--              <li class="list-group-item">A third item</li>-->
<!--          </ul>-->
      </div>
    </div>
  </div>

</body>
</html>
