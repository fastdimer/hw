<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container py-5">
    <h1 class="mb-4">Todo List</h1>

    <form data-create-form class="mb-4">
        <div class="mb-3">
            <input data-create-title class="form-control" type="text" placeholder="Title">
        </div>

        <div class="mb-3">
            <textarea data-create-description class="form-control" placeholder="Description"></textarea>
        </div>

        <button class="btn btn-success" type="submit">Add</button>
    </form>

    <form data-search-form class="mb-3">
        <div class="d-flex gap-2">
            <input data-search class="form-control" type="search" placeholder="Search">
            <button class="btn btn-primary" type="submit">Search</button>
        </div>
    </form>

    <div data-filters class="d-flex gap-2 mb-4">
        <button data-filter="all" class="btn btn-primary" type="button">All</button>
        <button data-filter="active" class="btn btn-outline-primary" type="button">Active</button>
        <button data-filter="completed" class="btn btn-outline-primary" type="button">Completed</button>
    </div>

    <div data-todo-list></div>
</div>

<div data-edit-modal class="modal fade" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Edit todo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form data-edit-form>
                <div class="modal-body">
                    <input data-edit-id type="hidden">

                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input data-edit-title class="form-control" type="text">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea data-edit-description class="form-control"></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>

        </div>
    </div>
</div>

<div data-delete-modal class="modal fade" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Delete todo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                Видалити задачу: <strong data-delete-title></strong>?
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button data-delete-confirm type="button" class="btn btn-danger">Delete</button>
            </div>

        </div>
    </div>
</div>

<script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="scripts/main.js"></script>
</body>
</html>
